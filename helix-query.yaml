version: 1

indices:
  pages:
    include:
      - '/**'
    exclude:
      - '/**.json'
      - '/language-masters/**'
      # nav and footer are fragments loaded into every page, not pages
      - '/**/nav'
      - '/**/footer'
      - '/nav'
      - '/footer'
    target: /query-index.json
    properties:
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")